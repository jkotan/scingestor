name: Test Package

on:
  push:
  pull_request:
  schedule:
    - cron: '30 0 23 * *'

jobs:

  flake8_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 .

  dpkg_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [debian13, debian12, debian11, ubuntu26.04, ubuntu24.04, ubuntu22.04]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2

      - name: Build the docker
        env:
          OS: ${{ matrix.os }}
        run: docker build -t ndts .ci/${OS}_py3

      - name: Run the docker
        run: docker run --name  ndts -d -it -v `pwd`:/home/scuser  ndts

      - name: install scicat-dataset-ingestor
        run: .ci/install.sh 3

      - name: run tests
        run: .ci/run.sh 3

      - name: Stop the docker
        run: docker container stop ndts

  pixi_ubuntu_tests:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: .github/workflows/pixi/pixi.toml
          pixi-version: v0.66.0
          cache: false
      - name: run tests
        shell: bash
        run: |
          pixi add  --manifest-path .github/workflows/pixi/pixi.toml rattler-build compilers sphinx
          pixi run --manifest-path .github/workflows/pixi/pixi.toml rattler-build build  --recipe .github/workflows/pixi/recipe.yaml
