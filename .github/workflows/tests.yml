name: Test Package

on:
  push:
  pull_request:
  schedule:
    - cron: '30 0 23 * *'

jobs:

  flake8_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 .

  dpkg_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [debian13, debian12, ubuntu26.04, ubuntu24.04, ubuntu22.04]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2

      - name: Build the docker
        env:
          OS: ${{ matrix.os }}
        run: docker build -t ndts .ci/${OS}_py3

      - name: Run the docker
        run: docker run --name  ndts -d -it -v `pwd`:/home/scuser  ndts

      - name: install scicat-dataset-ingestor
        env:
          OS: ${{ matrix.os }}
        run: .ci/install.sh ${OS}

      - name: run tests
        env:
          OS: ${{ matrix.os }}
        run: .ci/run.sh ${OS}

      - name: Append documentation for the latest release version
        if: (github.ref == 'refs/heads/main' ||  github.ref == 'refs/heads/issue_355') &&  matrix.os == 'debian13'
        run: |
             docker  exec ndts /bin/bash -c "cp doc/index.html doc/_config.yml build"
             docker  exec ndts /bin/bash -c "git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'"
             docker  exec ndts /bin/bash -c "git fetch && git checkout gh-pages && git pull"
             docker  exec ndts /bin/bash -c "mkdir -p ./latest && shopt -u dotglob && rm -rf ./latest/*"
             docker  exec ndts /bin/bash -c "mv -f build/sphinx/html/* ./latest/"
             docker  exec ndts /bin/bash -c "mv -f build/index.html build/_config.yml ."
             docker  exec --user root ndts /bin/bash -c "rm -rf build test scingestor  dist  scingestor.egg-info testresult.txt *.log*"

      - name: Extract the code version from the branch name
        if: startsWith(github.ref, 'refs/heads/docs_') && matrix.os == 'debian13'
        shell: bash
        run: echo "##[set-output name=docver;]$(echo ${GITHUB_REF#refs/heads/docs_})"
        id: extract_docver

      - name: Append documentation for the extracted release version
        if: startsWith(github.ref, 'refs/heads/docs_') &&  matrix.os == 'debian13'
        run: |
             echo Version: ${{ steps.extract_docver.outputs.docver }}
             docker  exec ndts /bin/bash -c "git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'"
             docker  exec ndts /bin/bash -c "git fetch && git checkout gh-pages && git pull"
             docker  exec ndts /bin/bash -c "mkdir -p ./${{ steps.extract_docver.outputs.docver }} && shopt -u dotglob && rm -rf ./${{ steps.extract_docver.outputs.docver }}/* "
             docker  exec ndts /bin/bash -c "mv -f build/sphinx/html/* ./${{ steps.extract_docver.outputs.docver }}"
             docker  exec --user root ndts /bin/bash -c "rm -rf build test scingestor  dist  scingestor.egg-info  testresult.txt *.log*"

      - name: Deploy documentation
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/docs_'))  &&  matrix.os == 'debian13'
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: gh-pages
          FOLDER: .
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"

      - name: Stop the docker
        run: docker container stop ndts

  pixi_ubuntu_tests:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: .github/workflows/pixi/pixi.toml
          pixi-version: v0.66.0
          cache: false
      - name: run tests
        shell: bash
        run: |
          pixi add  --manifest-path .github/workflows/pixi/pixi.toml rattler-build compilers sphinx
          pixi run --manifest-path .github/workflows/pixi/pixi.toml rattler-build build  --recipe .github/workflows/pixi/recipe.yaml
